name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build the release body for (e.g. v0.1.0)"
        required: true

# Read-only by default; only the job that touches this repo's release may write contents.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The tag reaches the shell only through this variable, always quoted. Git
    # allows $, ( ), ;, & and backticks in a tag name, and the form input takes
    # any text, so the tag is never written into a script line.
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # First step, before anything else runs: refuse any tag that is not a
      # release version. Every tag this repo has published is v and three numbers.
      - name: Check tag
        shell: bash
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "tag ${TAG} is a release version"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The tag must equal the version stamped in the build and the CHANGELOG.
      # Three siblings published a release whose binary reported a different
      # version than its own release page said.
      - name: Assert version
        run: tools/ci/assert-version.sh --tag "${TAG}"

      # A missing CHANGELOG section is a hard failure here. A sibling's CI
      # failed soft and published "See CHANGELOG.md for details." five times.
      - name: Build release body from CHANGELOG
        run: tools/ci/extract-changelog.sh "${TAG#v}" release-body.md

      - name: Lint release body
        run: tools/ci/lint-release-notes.sh release-body.md "${TAG#v}"

      # The release page is made BY HAND, as a draft, before the tag (Security 2026-11-25/26), with
      # exactly the body built above from CHANGELOG.md; the server zip and checksums.txt go onto it by
      # hand too. A tag never creates, edits or publishes a release here and never touches Latest: this
      # step only refuses when that draft is missing or wrong. gh finds drafts (GitHub's look-up of a
      # release by tag answers 404 for one). Read the files back, scan, then publish by hand.
      - name: The hand-made draft release is in place
        env:
          # The workflow's own token (Security 2026-11-25); it can see a draft because this job may write contents.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          rels="$(gh api "repos/${REPO}/releases?per_page=100" --paginate \
            | jq -s --arg t "${TAG}" 'add // [] | map(select(.tag_name == $t))')"
          n="$(jq 'length' <<<"${rels}")"
          if [ "${n}" -ne 1 ]; then
            echo "::error::expected exactly one release for ${TAG} (a draft made by hand first), found ${n}; this workflow never makes one"
            exit 1
          fi
          if [ "$(jq -r '.[0].draft' <<<"${rels}")" != "true" ]; then
            echo "::error::the release for ${TAG} is already published; a tag here only ever meets a hand-made draft"
            exit 1
          fi
          jq -r '.[0].body // ""' <<<"${rels}" > draft-body.md
          same="$(jq -n --rawfile a draft-body.md --rawfile b release-body.md \
            '($a | ltrimstr("\ufeff") | gsub("\r"; "") | sub("\\s+$"; "")) == ($b | ltrimstr("\ufeff") | gsub("\r"; "") | sub("\\s+$"; ""))')"
          if [ "${same}" != "true" ]; then
            echo "::error::the draft's text differs from the body built from CHANGELOG.md; fix the draft by hand"
            exit 1
          fi
          others="$(jq -r --arg z "WaygateServer-${TAG#v}.zip" \
            '.[0].assets[].name | select(. != $z and . != "checksums.txt")' <<<"${rels}")"
          if [ -n "${others}" ]; then
            echo "::error::the draft holds files other than WaygateServer-${TAG#v}.zip and checksums.txt: ${others}"
            exit 1
          fi
          echo "Draft ${TAG} (release $(jq -r '.[0].id' <<<"${rels}")) is in place, made by hand."

      - name: Assert release author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR=$(gh release view "${TAG}" --json author --jq .author.login)
          echo "release author: ${AUTHOR}"
          # Case-insensitive: the account's login is lowercase 'humangenome'
          # while the display name is 'HumanGenome', and GitHub logins are not
          # case-sensitive. The failure this guards against is the release
          # being authored github-actions[bot], which no casing rescues.
          if [ "$(echo "${AUTHOR}" | tr '[:upper:]' '[:lower:]')" != "humangenome" ]; then
            echo "::error::release is authored '${AUTHOR}', expected HumanGenome — the release must be made by hand as humangenome before the tag"
            exit 1
          fi
